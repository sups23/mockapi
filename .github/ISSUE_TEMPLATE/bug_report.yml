name: Bug report
description: Report a reproducible problem in Seedbox.
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Please search existing issues first. Do not include secrets or private data.
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: v0.1.0 or commit SHA
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Include the expected and actual behavior.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Include the route, request, configuration, or UI steps needed to reproduce it.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: PHP version, OS, browser
    validations:
      required: true
